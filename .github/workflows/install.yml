name: brew install

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Every sha256 must match the checksums file of its xion release.
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check cask checksums against the releases
        run: python3 scripts/check-cask-checksums.py

  # The install matrix is every file in Casks/, so a new cask is tested
  # without editing this workflow.
  casks:
    runs-on: ubuntu-latest
    outputs:
      casks: ${{ steps.list.outputs.casks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List casks
        id: list
        run: |
          set -euo pipefail
          # The tap is casks only.
          test ! -e Formula
          casks="$(find Casks -name '*.rb' -exec basename {} .rb \; | sort -V | jq -R . | jq -sc .)"
          echo "$casks" | jq -r '.[]'
          echo "casks=$casks" >> "$GITHUB_OUTPUT"

  install:
    needs: casks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        cask: ${{ fromJSON(needs.casks.outputs.casks) }}

    env:
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      CASK: ${{ matrix.cask }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install the cask
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi

          brew tap burnt-labs/xion ${{ github.workspace }}
          brew trust burnt-labs/xion

          brew install --cask "burnt-labs/xion/$CASK"

          expected="$(brew info --cask --json=v2 "burnt-labs/xion/$CASK" | jq -r '.casks[0].version')"
          xiond version --long
          test "$(xiond version)" = "v$expected"

          # A hosted runner's Gatekeeper may not match a Mac's, so record its
          # status and whether the binary carries a quarantine attribute.
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            spctl --status || true
            xattr -l "$(readlink -f "$(command -v xiond)")" || true
          fi

  # Users of a retired formula must be moved to the cask of the same name by
  # `brew update` (tap_migrations.json). Start from the last tap commit that
  # shipped the formula (`before`), install it, move the tap to this commit and
  # check that the cask replaced it. `from` is the formula's version.
  migrate-formula-to-cask:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        formula:
          - xiond
          - xiond@29
          - xiond@29.0.1
          - xiond@4.0.1
          - xiond@12
          - xiond@27.0.0-rc2
          - xiond@29.0.0
        include:
          # Last commit with Formula/xiond.rb (frozen at 29.0.1).
          - formula: xiond
            before: fabb14346d35ac03733a6bc835e1108a373140a9
            from: 29.0.1
          - formula: xiond@29
            before: fabb14346d35ac03733a6bc835e1108a373140a9
            from: 29.0.1
          - formula: xiond@29.0.1
            before: fabb14346d35ac03733a6bc835e1108a373140a9
            from: 29.0.1
          # Last commit with Formula/: the oldest release, a release that
          # shipped bare binaries instead of archives (most of v12 to v14),
          # a release candidate and 29.0.0.
          - formula: xiond@4.0.1
            before: 1ec786317200eb360dd8075e1725bf830870ba3a
            from: 4.0.1
          - formula: xiond@12
            before: 1ec786317200eb360dd8075e1725bf830870ba3a
            from: 12.0.1
          - formula: xiond@27.0.0-rc2
            before: 1ec786317200eb360dd8075e1725bf830870ba3a
            from: 27.0.0-rc2
          - formula: xiond@29.0.0
            before: 1ec786317200eb360dd8075e1725bf830870ba3a
            from: 29.0.0

    env:
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      BEFORE: ${{ matrix.before }}
      FROM: ${{ matrix.from }}
      FORMULA: ${{ matrix.formula }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install the formula from the pre-migration tap
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi

          tap_git="$RUNNER_TEMP/homebrew-xion.git"
          git init --quiet --bare "$tap_git"
          git push --quiet "$tap_git" "$BEFORE:refs/heads/main"
          git -C "$tap_git" symbolic-ref HEAD refs/heads/main

          brew tap burnt-labs/xion "file://$tap_git"
          brew trust burnt-labs/xion
          brew install --formula "burnt-labs/xion/$FORMULA"
          # A Mac that has ever installed a cask has a Caskroom; the automatic
          # migration only runs when it exists.
          mkdir -p "$(brew --prefix)/Caskroom"

          xiond version
          test "$(xiond version)" = "v$FROM"

      - name: Update the tap to this commit
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi

          git push --quiet --force "$RUNNER_TEMP/homebrew-xion.git" "HEAD:refs/heads/main"
          brew update

      - name: Check that the cask replaced the formula
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi

          brew list --cask --versions "$FORMULA"
          expected="$(brew info --cask --json=v2 "burnt-labs/xion/$FORMULA" | jq -r '.casks[0].version')"
          xiond version
          test "$(xiond version)" = "v$expected"
          readlink "$(brew --prefix)/bin/xiond" | grep -q "/Caskroom/$FORMULA/"

          # The step Homebrew asks the user to finish with, then a clean upgrade.
          brew uninstall --formula --force "$FORMULA"
          brew upgrade "$FORMULA"
          test "$(xiond version)" = "v$expected"
