name: brew install

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        version:
          - "4.0.1"
          - "4"
          - "6.0.1"
          - "6.1.1"
          - "6"
          - "7.0.1"
          - "7"
          - "8.0.2"
          - "8"
          - "9.0.2"
          - "9"
          - "11.0.2"
          - "11"
          - "12.0.0"
          - "12.0.1"
          - "12"
          - "13.0.0"
          - "13.0.1"
          - "13"
          - "14.0.0"
          - "14.0.1"
          - "14.1.0"
          - "14.1.1"
          - "14.1.2"
          - "14"
          - "15.0.1"
          - "15"
          - "16.0.1"
          - "16"
          - "17.0.1"
          - "17.1.1"
          - "17"
          - "18.0.1"
          - "18.0.2"
          - "18"
          - "19.0.1"
          - "19.0.2"
          - "19"
          - "20.0.0"
          - "20"
          - "21.0.0"
          - "21.0.1"
          - "21"
          - "22.0.0"
          - "22"
          - "23.0.0"
          - "23"
          - "24.0.0"
          - "24"
          - "25.0.1"
          - "25.0.2"
          - "25"
          - "29.0.1"
          - "29"
          - "30.0.0"
          - "30"
          - "31.0.2"
          - "31"
          - "null"

    env:
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install Xiond
        run: |
          echo "Matrix OS: ${{ matrix.os }}"
          echo "Matrix version: ${{ matrix.version }}"

          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi

          brew tap burnt-labs/xion ${{ github.workspace }}
          brew trust burnt-labs/xion

          if [[ "${{ matrix.version }}" == "null" ]]; then
            echo "Installing latest version of xiond"
            brew install xiond
          else
            echo "Installing xiond version ${{ matrix.version }}"
            brew install xiond@${{ matrix.version }}
          fi

          xiond version --long

  # Users of the old `xiond`, `xiond@29` and `xiond@29.0.1` formulae must be moved to the
  # casks by `brew update` (tap_migrations.json). Start from the last tap commit
  # that still shipped those formulae, install one, move the tap to this commit
  # and check that the cask replaced it.
  migrate-formula-to-cask:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        formula: [xiond, xiond@29, xiond@29.0.1]

    env:
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      # Last commit with Formula/xiond.rb (frozen at 29.0.1).
      BEFORE: fabb14346d35ac03733a6bc835e1108a373140a9
      FORMULA: ${{ matrix.formula }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install the formula from the pre-migration tap
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi

          tap_git="$RUNNER_TEMP/homebrew-xion.git"
          git init --quiet --bare "$tap_git"
          git push --quiet "$tap_git" "$BEFORE:refs/heads/main"
          git -C "$tap_git" symbolic-ref HEAD refs/heads/main

          brew tap burnt-labs/xion "file://$tap_git"
          brew trust burnt-labs/xion
          brew install --formula "burnt-labs/xion/$FORMULA"
          # A Mac that has ever installed a cask has a Caskroom; the automatic
          # migration only runs when it exists.
          mkdir -p "$(brew --prefix)/Caskroom"

          xiond version
          test "$(xiond version)" = "v29.0.1"

      - name: Update the tap to this commit
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi

          git push --quiet --force "$RUNNER_TEMP/homebrew-xion.git" "HEAD:refs/heads/main"
          brew update

      - name: Check that the cask replaced the formula
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi

          brew list --cask --versions "$FORMULA"
          expected="$(brew info --cask --json=v2 "burnt-labs/xion/$FORMULA" | jq -r '.casks[0].version')"
          xiond version
          test "$(xiond version)" = "v$expected"
          readlink "$(brew --prefix)/bin/xiond" | grep -q "/Caskroom/$FORMULA/"

          # The step Homebrew asks the user to finish with, then a clean upgrade.
          brew uninstall --formula --force "$FORMULA"
          brew upgrade "$FORMULA"
          test "$(xiond version)" = "v$expected"
