name: Update Homebrew Formula

# Thin trigger around generate.sh, which owns the formula generation and can
# be run locally the same way: ./generate.sh <tag>

on:
  repository_dispatch:
    types: [homebrew-release-trigger]
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string
        description: The release tag name (e.g., v21.0.0)
      release_name:
        required: false
        type: string
        description: The release name

permissions:
  contents: write
  pull-requests: write

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-xion
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from tag
        id: version
        # Payload/input values are env-bound (not interpolated into the script text) so a
        # crafted tag can't inject shell on the runner.
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          VERSION="${TAG#v}"

          # Check if this is a pre-release (contains -rc, -alpha, -beta, etc.)
          IS_PRERELEASE="false"
          if echo "$VERSION" | grep -qiE '-(rc|alpha|beta|preview|dev)'; then
            IS_PRERELEASE="true"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Create branch
        id: branch
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BRANCH="xiond-${TAG}"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Generate formulas
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: ./generate.sh "$TAG"

      - name: Commit changes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add Formula/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Brew formula update for xiond version ${TAG}"

      - name: Push changes
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git push origin "$BRANCH" || git push -f origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.BURNT_PAT_GITHUB_ACTIONS_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          if [ "$IS_PRERELEASE" == "true" ]; then
            PR_TITLE="[Pre-release] Brew formula update for xiond version ${TAG}"
            PR_BODY="Updates the Homebrew versioned formulas for xiond pre-release ${TAG}. Note: This is a pre-release. The main xiond.rb formula is unchanged (users running brew install xiond will still get the latest stable release). To install this pre-release: brew install burnt-labs/xion/xiond@${VERSION}"
          else
            PR_TITLE="Brew formula update for xiond version ${TAG}"
            PR_BODY="Updates the Homebrew formula for xiond to version ${TAG}"
          fi

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --repo burnt-labs/homebrew-xion --head "$BRANCH" --json number --jq '.[0].number' || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH"
            exit 0
          fi

          # Create new PR
          gh pr create \
            --repo burnt-labs/homebrew-xion \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label "automated" || echo "Failed to create PR or PR already exists"
